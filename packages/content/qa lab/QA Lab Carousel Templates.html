<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

/* ── TOKENS ─────────────────────────────────────────────── */
const BG    = '#111110';
const AMBER = '#C8962A';
const CREAM = '#F3EDD8';
const DIM   = '#1E1E1A';
const MID   = '#2C2C24';

/* ── SCALE: slides at 360px = 1/3 of 1080px ─────────────── */
const S  = 360;
const sc = S / 1080;
const px = n => Math.round(n * sc);

/* ── BRAND STAMP ─────────────────────────────────────────── */
function Brand({ dark = false }) {
  const fg = dark ? BG : CREAM;
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
      <span style={{
        fontFamily: 'Barlow Condensed, sans-serif',
        fontWeight: 900,
        fontSize: px(36),
        letterSpacing: '0.07em',
        color: AMBER,
        lineHeight: 1,
      }}>QA LAB</span>
      <span style={{
        fontFamily: 'Space Grotesk, sans-serif',
        fontWeight: 400,
        fontSize: px(20),
        letterSpacing: '0.18em',
        textTransform: 'uppercase',
        color: fg,
        opacity: 0.32,
      }}>qalab.io</span>
    </div>
  );
}

/* ── SLIDE SHELL ──────────────────────────────────────────── */
function Shell({ children, bg = BG, pad = true }) {
  return (
    <div style={{
      width: S, height: S,
      background: bg,
      display: 'flex',
      flexDirection: 'column',
      padding: pad ? `${px(64)}px ${px(68)}px` : 0,
      overflow: 'hidden',
      position: 'relative',
    }}>
      {children}
    </div>
  );
}

function T8Cover() {

      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'flex-end', gap: px(18) }}>

        </div>
      </div>
    </Shell>
  );
}
function T8Snippet({ num, pattern, lines, note }) {
  return (
    <Shell>
      <Brand/>
      <div style={{ color: AMBER, fontSize: px(15), letterSpacing: '0.22em', textTransform: 'uppercase', fontWeight: 500, marginTop: px(12), marginBottom: px(10) }}>{String(num).padStart(2,'0')} · {pattern}</div>
      <div style={{ background: '#0A0A08', border: `${px(2)}px solid ${DIM}`, padding: `${px(16)}px ${px(18)}px`, flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: px(3) }}>
        {lines.map((line, i) => {
          const isComment = line.trimStart().startsWith('//');
          const isKeyword = /^(describe|it\(|test\(|expect|function|const|async|await)/.test(line.trimStart());
          const clr = isComment ? '#5A7A5A' : isKeyword ? AMBER : CREAM;
          return <div key={i} style={{ fontFamily: 'monospace', fontSize: px(19), lineHeight: 1.55, color: clr, whiteSpace: 'pre' }}>{line || '\u00A0'}</div>;
        })}
      </div>
      {note && <div style={{ color: CREAM, fontSize: px(18), lineHeight: 1.5, opacity: 0.42, marginTop: px(8) }}>{note}</div>}
    </Shell>
  );
}
function T8CTA() {
  return (
    <Shell>
      <Brand/>
      <div style={{ position: 'absolute', right: px(36), bottom: px(56), color: AMBER, fontFamily: 'monospace', fontSize: px(120), lineHeight: 1, opacity: 0.05, userSelect: 'none' }}>{'</>'}</div>

      </div>
    </Shell>
  );
}
