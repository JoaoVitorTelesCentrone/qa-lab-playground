<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Lab — Brand Identity System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1A1A12; font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard } = window;

/* ══════════════════════════════════════
   TOKENS
══════════════════════════════════════ */
const BG    = '#2A2A1E';
const SAGE  = '#8A9A6A';
const CREAM = '#F0EEE0';
const DIM   = '#3C3C2C';
const MID   = '#4E4E3A';

/* ══════════════════════════════════════
   MARK — Microscope + Flask
   viewBox 0 0 148 100
══════════════════════════════════════ */
function QAMark({ scale = 1, color = SAGE, bg = BG }) {
  const w = Math.round(148 * scale);
  const h = Math.round(100 * scale);
  return (
    <svg width={w} height={h} viewBox="0 0 148 100"
         fill={color} style={{ display: 'block', flexShrink: 0 }}>

      {/* ── MICROSCOPE ── */}
      {/* Base plate */}
      <rect x="5"  y="88" width="56" height="7"  rx="1.5"/>
      {/* Left foot */}
      <rect x="5"  y="80" width="17" height="9"/>
      {/* Right foot */}
      <rect x="44" y="80" width="17" height="9"/>
      {/* Main column */}
      <rect x="27" y="24" width="8"  height="59"/>
      {/* Stage arm */}
      <rect x="9"  y="57" width="36" height="5"/>
      {/* Stage clip */}
      <rect x="13" y="51" width="17" height="7"  rx="1"/>
      {/* Diagonal arm to eyepiece mount */}
      <polygon points="27,24 35,24 58,6 51,2"/>
      {/* Eyepiece tube */}
      <rect x="48" y="2"  width="11" height="25" rx="3"/>
      {/* Eyepiece cap */}
      <rect x="46" y="2"  width="15" height="5"  rx="1"/>
      {/* Objective housing */}
      <rect x="27" y="62" width="8"  height="20" rx="2"/>
      {/* Objective tip */}
      <rect x="25" y="80" width="12" height="4"  rx="1"/>
      {/* Coarse focus knob */}
      <circle cx="31" cy="43" r="5.5"/>
      {/* Fine focus knob */}
      <circle cx="31" cy="32" r="3.5"/>

      {/* ── ERLENMEYER FLASK ── */}
      {/* Mouth rim */}
      <rect x="84" y="10" width="20" height="5"  rx="2"/>
      {/* Neck */}
      <rect x="86" y="15" width="16" height="28" rx="1"/>
      {/* Conical body */}
      <path d="M86,43 L71,88 L117,88 L102,43 Z"/>
      {/* Bubbles — knockout circles */}
      <circle cx="83"  cy="69" r="5.5" fill={bg}/>
      <circle cx="94"  cy="59" r="4.5" fill={bg}/>
      <circle cx="100" cy="73" r="3.5" fill={bg}/>
    </svg>
  );
}

/* ══════════════════════════════════════
   WORDMARK — Custom LAB letterforms
   viewBox 0 0 144 64
   L: 0–40  A: 48–94  B: 102–144
══════════════════════════════════════ */
function LABMark({ height = 60, color = SAGE }) {
  const vw = 144, vh = 64;
  const w  = Math.round(height * vw / vh);
  return (
    <svg width={w} height={height} viewBox={`0 0 ${vw} ${vh}`}
         fill={color} style={{ display: 'block', flexShrink: 0 }}>

      {/* ── L  with angled inner-corner cut ── */}
      <polygon points="0,0 11,0 11,46 18,53 40,53 40,64 0,64"/>

      {/* ── A ── */}
      {/* Left leg  */}
      <polygon points="48,64 71,0 71,9 58,64"/>
      {/* Right leg */}
      <polygon points="94,64 71,0 71,9 83,64"/>
      {/* Crossbar — spans outer edge to outer edge at y=36 */}
      <rect x="57" y="35" width="28" height="9"/>

      {/* ── B ── */}
      {/* Stem */}
      <rect x="102" y="0" width="11" height="64"/>
      {/* Top bump — pentagon outer / inner (evenodd → hollow) */}
      <path fillRule="evenodd" d="
        M 113,0  L 134,0  L 141,15 L 134,29 L 113,29 Z
        M 113,8  L 126,8  L 133,15 L 126,22 L 113,22 Z
      "/>
      {/* Bottom bump — slightly taller for classic B proportions */}
      <path fillRule="evenodd" d="
        M 113,35 L 136,35 L 144,51 L 136,64 L 113,64 Z
        M 113,43 L 128,43 L 136,51 L 128,58 L 113,58 Z
      "/>
    </svg>
  );
}

/* ══════════════════════════════════════
   LOGO LOCKUP
══════════════════════════════════════ */
function QALogo({ layout = 'h', scale = 1, color = SAGE, bg = BG }) {
  const mh  = Math.round(84 * scale);  // mark height
  const wh  = Math.round(52 * scale);  // wordmark height
  const gap = Math.round(18 * scale);
  const labelSz = Math.max(8, Math.round(9 * scale));

  const qaLabel = (
    <div style={{
      fontFamily: 'Space Grotesk, sans-serif',
      fontWeight: 500,
      fontSize: labelSz,
      letterSpacing: '0.24em',
      textTransform: 'uppercase',
      color,
      opacity: 0.48,
      marginBottom: Math.round(3 * scale),
    }}>Quality Assurance</div>
  );

  if (layout === 'h') {
    return (
      <div style={{ display: 'flex', alignItems: 'center', gap }}>
        <QAMark scale={mh / 100} color={color} bg={bg}/>
        <div>
          {qaLabel}
          <LABMark height={wh} color={color}/>
        </div>
      </div>
    );
  }
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap }}>
      <QAMark scale={mh / 100} color={color} bg={bg}/>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
        {qaLabel}
        <LABMark height={Math.round(wh * 0.88)} color={color}/>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   SHARED helpers
══════════════════════════════════════ */
const center = (bg) => ({
  background: bg,
  display: 'flex',
  alignItems: 'center',
  justifyContent: 'center',
});

/* ══════════════════════════════════════
   MARK ARTBOARDS
══════════════════════════════════════ */
function MarkDark() {
  return (
    <div style={{ ...center(BG), width: 280, height: 210 }}>
      <QAMark scale={1.35} color={SAGE} bg={BG}/>
    </div>
  );
}
function MarkLight() {
  return (
    <div style={{ ...center(CREAM), width: 280, height: 210 }}>
      <QAMark scale={1.35} color={BG} bg={CREAM}/>
    </div>
  );
}
function MarkMono() {
  return (
    <div style={{ ...center('#101009'), width: 280, height: 210 }}>
      <QAMark scale={1.35} color="#FFFFFF" bg="#101009"/>
    </div>
  );
}

/* ══════════════════════════════════════
   LOCKUP ARTBOARDS
══════════════════════════════════════ */
function LockupHDark() {
  return (
    <div style={{ ...center(BG), width: 520, height: 190 }}>
      <QALogo layout="h" scale={1.15} color={SAGE} bg={BG}/>
    </div>
  );
}
function LockupHLight() {
  return (
    <div style={{ ...center(CREAM), width: 520, height: 190 }}>
      <QALogo layout="h" scale={1.15} color={BG} bg={CREAM}/>
    </div>
  );
}
function LockupStacked() {
  return (
    <div style={{ ...center(BG), width: 300, height: 340 }}>
      <QALogo layout="v" scale={1.3} color={SAGE} bg={BG}/>
    </div>
  );
}

/* ══════════════════════════════════════
   COLOR PALETTE
══════════════════════════════════════ */
function QAPalette() {
  const swatches = [
    { name: 'Background', hex: '#2A2A1E', note: 'Primary canvas' },
    { name: 'Primary',    hex: '#8A9A6A', note: 'Brand / UI tone'  },
    { name: 'Highlight',  hex: '#F0EEE0', note: 'Type / contrast'  },
  ];
  const tones = ['#C4CE9E','#B2BC8C','#9EAA78','#8A9A6A','#78885A','#68764C','#58663E','#2A2A1E'];

  return (
    <div style={{ background: BG, padding: 32, width: 560 }}>
      <div style={{ color: SAGE, fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', marginBottom: 24, opacity: 0.55 }}>
        Color System
      </div>

      {/* Swatches */}
      <div style={{ display: 'flex', gap: 14, marginBottom: 28 }}>
        {swatches.map(({ name, hex, note }) => (
          <div key={hex} style={{ flex: 1 }}>
            <div style={{
              height: 80,
              background: hex,
              outline: hex === BG ? `1px solid ${DIM}` : 'none',
              marginBottom: 12,
            }}/>
            <div style={{ color: CREAM, fontFamily: 'Space Grotesk, sans-serif', fontSize: 12, fontWeight: 600, marginBottom: 3 }}>{name}</div>
            <div style={{ color: SAGE, fontSize: 11, letterSpacing: '0.06em', fontFamily: 'monospace', marginBottom: 3 }}>{hex}</div>
            <div style={{ color: CREAM, fontSize: 11, opacity: 0.38 }}>{note}</div>
          </div>
        ))}
      </div>

      {/* Tonal scale */}
      <div style={{ color: CREAM, fontSize: 10, letterSpacing: '0.18em', textTransform: 'uppercase', opacity: 0.3, marginBottom: 7 }}>
        Sage Tonal Scale
      </div>
      <div style={{ display: 'flex', gap: 3, marginBottom: 28 }}>
        {tones.map((c, i) => (
          <div key={i} style={{ flex: 1, height: 14, background: c }}/>
        ))}
      </div>

      {/* Rules */}
      <div style={{ display: 'flex', gap: 12 }}>
        <div style={{ flex: 1, padding: '12px 14px', border: `1px solid ${DIM}` }}>
          <div style={{ color: SAGE, fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', marginBottom: 8 }}>✓  Use</div>
          <div style={{ color: CREAM, fontSize: 11, lineHeight: 1.7, opacity: 0.62 }}>
            Sage on dark background<br/>
            Cream for all body copy<br/>
            Hard flat fills only
          </div>
        </div>
        <div style={{ flex: 1, padding: '12px 14px', border: `1px solid ${DIM}` }}>
          <div style={{ color: '#B05050', fontSize: 10, letterSpacing: '0.16em', textTransform: 'uppercase', marginBottom: 8 }}>✕  Avoid</div>
          <div style={{ color: CREAM, fontSize: 11, lineHeight: 1.7, opacity: 0.62 }}>
            Gradients or drop shadows<br/>
            Any additional accent colors<br/>
            Decorative texture or pattern
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════
   TYPOGRAPHY SPECIMEN
══════════════════════════════════════ */
function QATypeSpec() {
  const Row = ({ label, children, last }) => (
    <div style={{ borderBottom: last ? 'none' : `1px solid ${DIM}`, paddingBottom: last ? 0 : 18, marginBottom: last ? 0 : 18 }}>
      <div style={{ color: SAGE, fontSize: 9, letterSpacing: '0.18em', textTransform: 'uppercase', marginBottom: 8, opacity: 0.55 }}>{label}</div>
      {children}
    </div>
  );
  return (
    <div style={{ background: BG, padding: 32, width: 560 }}>
      <div style={{ color: SAGE, fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', marginBottom: 24, opacity: 0.55 }}>
        Typography
      </div>
      <Row label="Display · Barlow Condensed 900">
        <div style={{ color: CREAM, fontFamily: 'Barlow Condensed, sans-serif', fontWeight: 900, fontSize: 68, textTransform: 'uppercase', letterSpacing: '-0.01em', lineHeight: 1 }}>
          QA LAB
        </div>
      </Row>
      <Row label="Heading · Barlow Condensed 700">
        <div style={{ color: CREAM, fontFamily: 'Barlow Condensed, sans-serif', fontWeight: 700, fontSize: 30, textTransform: 'uppercase', letterSpacing: '0.04em', lineHeight: 1.1 }}>
          Software Quality Assurance Education
        </div>
      </Row>
      <Row label="Label · Space Grotesk 500 Uppercase">
        <div style={{ color: SAGE, fontFamily: 'Space Grotesk, sans-serif', fontWeight: 500, fontSize: 11, letterSpacing: '0.2em', textTransform: 'uppercase' }}>
          Test Coverage · Bug Reports · CI/CD Integration
        </div>
      </Row>
      <Row label="Body · Space Grotesk 400">
        <div style={{ color: CREAM, fontFamily: 'Space Grotesk, sans-serif', fontWeight: 400, fontSize: 13, lineHeight: 1.7, opacity: 0.68 }}>
          Precision over ceremony. Every release is a contract with users. QA Lab teaches you to hold the line — systematically, repeatably, without noise.
        </div>
      </Row>
      <Row label="Caption · Space Grotesk 300" last>
        <div style={{ color: CREAM, fontFamily: 'Space Grotesk, sans-serif', fontWeight: 300, fontSize: 11, letterSpacing: '0.04em', opacity: 0.42 }}>
          Module 04 · 4.5 hours · 12 lessons · Updated June 2026
        </div>
      </Row>
    </div>
  );
}

/* ══════════════════════════════════════
   USE CASE 1 — Square Post 1080×1080
   displayed at 540×540 (50%)
══════════════════════════════════════ */
function QASquarePost() {
  return (
    <div style={{ width: 540, height: 540, background: BG, position: 'relative', overflow: 'hidden' }}>

      {/* Subtle engineering grid */}
      <svg style={{ position: 'absolute', inset: 0 }} width="540" height="540"
           viewBox="0 0 540 540" fill="none" stroke={SAGE} strokeWidth="0.4" opacity="0.07">
        {[1,2,3,4,5].map(i => <line key={`h${i}`} x1="0" y1={i*90} x2="540" y2={i*90}/>)}
        {[1,2,3,4,5].map(i => <line key={`v${i}`} x1={i*90} y1="0" x2={i*90} y2="540"/>)}
      </svg>

      {/* Registration corner marks */}
      <svg style={{ position: 'absolute', inset: 0, pointerEvents: 'none' }} width="540" height="540"
           viewBox="0 0 540 540" stroke={SAGE} strokeWidth="1" fill="none" opacity="0.22">
        <line x1="22" y1="20" x2="36" y2="20"/><line x1="22" y1="20" x2="22" y2="34"/>
        <line x1="518" y1="20" x2="504" y2="20"/><line x1="518" y1="20" x2="518" y2="34"/>
        <line x1="22" y1="520" x2="36" y2="520"/><line x1="22" y1="520" x2="22" y2="506"/>
        <line x1="518" y1="520" x2="504" y2="520"/><line x1="518" y1="520" x2="518" y2="506"/>
      </svg>

      <div style={{ position: 'absolute', inset: 48, display: 'flex', flexDirection: 'column', justifyContent: 'space-between' }}>

        {/* Top — Logo */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <QAMark scale={0.46} color={SAGE} bg={BG}/>
          <LABMark height={33} color={SAGE}/>
        </div>

        {/* Middle — Headline */}
        <div>
          <div style={{ color: SAGE, fontSize: 10, letterSpacing: '0.26em', textTransform: 'uppercase', marginBottom: 16 }}>
            Course Module 04
          </div>
          <div style={{
            color: CREAM,
            fontFamily: 'Barlow Condensed, sans-serif',
            fontWeight: 900,
            fontSize: 94,
            lineHeight: 0.91,
            textTransform: 'uppercase',
            letterSpacing: '-0.01em',
          }}>
            API<br/>TESTING<br/>DEPTH
          </div>
          <div style={{ marginTop: 22, display: 'flex', alignItems: 'center', gap: 16 }}>
            <div style={{ width: 36, height: 2, background: SAGE }}/>
            <div style={{ color: SAGE, fontSize: 10, letterSpacing: '0.16em' }}>4.5h · 12 lessons</div>
          </div>
        </div>

        {/* Bottom — Footer */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{ color: SAGE, fontSize: 10, letterSpacing: '0.14em', opacity: 0.5 }}>qalab.io</div>
          <div style={{ color: CREAM, fontSize: 10, letterSpacing: '0.12em', opacity: 0.28 }}>#QALab</div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════

      {/* Left accent bar */}

      <div style={{ display: 'flex', alignItems: 'center', flex: 1, padding: '0 44px', gap: 44 }}>

        {/* Logo */}
        <div style={{ flexShrink: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 7 }}>
            <QAMark scale={0.54} color={SAGE} bg={BG}/>
            <LABMark height={38} color={SAGE}/>
          </div>
          <div style={{ color: SAGE, fontSize: 9, letterSpacing: '0.22em', textTransform: 'uppercase', opacity: 0.48 }}>
            Quality Assurance Education
          </div>
        </div>

        {/* Divider */}
        <div style={{ width: 1, height: 76, background: SAGE, opacity: 0.16, flexShrink: 0 }}/>

/* ══════════════════════════════════════
   USE CASE 3 — Dark Card
══════════════════════════════════════ */

  const tags = ['REST', 'GraphQL', 'Auth', 'Mocks'];

  return (
    <div style={{ width: 360, background: BG, border: `1px solid ${DIM}` }}>

        </div>

      {/* Body */}
      <div style={{ padding: 24 }}>

        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 18 }}>
          {tags.map(t => (
            <div key={t} style={{

              border: `1px solid ${MID}`,
              color: SAGE,
              fontSize: 9,
              letterSpacing: '0.16em',
              textTransform: 'uppercase',
            }}>{t}</div>
          ))}
        </div>

        {/* Title */}

          color: CREAM,
          fontFamily: 'Barlow Condensed, sans-serif',
          fontWeight: 900,
          fontSize: 36,

          lineHeight: 1.02,
          marginBottom: 14,
        }}>
          API Testing<br/>in Depth
        </div>

        {/* Description */}
        <div style={{ color: CREAM, fontSize: 13, lineHeight: 1.65, opacity: 0.55, marginBottom: 22 }}>
          Contract testing, mock servers, schema validation. Build test suites that catch breaking changes before your users do.
        </div>

        {/* Progress */}

/* ══════════════════════════════════════
   APP
══════════════════════════════════════ */
function App() {
  return (
    <DesignCanvas>

      <DCSection id="s-mark" title="Brand Mark">
        <DCArtboard id="mk-dk" label="Dark ground" width={280} height={210}>
          <MarkDark/>
        </DCArtboard>
        <DCArtboard id="mk-lt" label="Light ground" width={280} height={210}>
          <MarkLight/>
        </DCArtboard>
        <DCArtboard id="mk-mn" label="Monochrome" width={280} height={210}>
          <MarkMono/>
        </DCArtboard>
      </DCSection>

      <DCSection id="s-lock" title="Logo Lockups">
        <DCArtboard id="lk-hd" label="Horizontal — Dark" width={520} height={190}>
