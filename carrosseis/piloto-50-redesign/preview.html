<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <title>QA Lab — piloto do carrossel 50</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101a18;color:#f2f4ec;font-family:Arial,Helvetica,sans-serif}

<body>
  <header><h1>Carrossel piloto · IA + QA</h1><p>Arraste para o lado ou use a barra horizontal para ver os cinco slides.</p></header>
