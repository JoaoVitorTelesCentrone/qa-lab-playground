name: Tool guide links

# Os guias de /ferramentas apontam para documentação, cursos e vídeos externos.
# Uma vez por mês, confere se algum saiu do ar.
on:
  schedule:
    - cron: "0 11 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check links
        working-directory: packages/web
        run: bun run guides:check-links
