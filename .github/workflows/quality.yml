name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build web app
        run: bun run build

      - name: Install Chromium for smoke tests
        run: bunx playwright install --with-deps chromium

      - name: Run launch smoke tests
        run: bun run --filter '@qa-lab/web' test:e2e:smoke

  mentorship:
    name: Mentorship v2, permissions and payments
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        working-directory: packages/web
        run: bunx playwright install --with-deps chromium
      - name: Run mandatory isolated mentorship suite
        working-directory: packages/web
        run: bun run test:e2e:mentorship
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mentorship-v2-test-results
          path: packages/web/test-results
          retention-days: 7
