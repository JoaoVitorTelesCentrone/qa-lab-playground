name: Research Library

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update research library
        working-directory: packages/web
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
          RESEARCH_LOOKBACK_DAYS: "14"
          RESEARCH_MAX_RESULTS_PER_QUERY: "20"
        run: bun run research:update

      - name: Commit updates
        run: |
          if git diff --quiet -- packages/web/data/research-library.generated.json; then
            echo "No research updates found."
            exit 0
          fi
          git config user.name "qa-lab-research-bot"
          git config user.email "qa-lab-research-bot@users.noreply.github.com"
          git add packages/web/data/research-library.generated.json
          git commit -m "Update QA research library"
          git push
